spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_TEST_NAME}?characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&sslMode=PREFERRED&allowPublicKeyRetrieval=false&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CakeIsolatedTestPool
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  main:
    banner-mode: off
server:
  port: 0
logging:
  level:
    root: WARN
