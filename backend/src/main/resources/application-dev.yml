spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cake_order_system}?characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&sslMode=PREFERRED&allowPublicKeyRetrieval=false&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CakeDevelopmentPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1
mybatis-plus:
  configuration:
    log-impl: com.cake.platform.config.SqlEventLog
logging:
  level:
    com.cake.platform.sql.events: DEBUG
